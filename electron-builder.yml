appId: com.hexodeck.app
productName: HexoDeck
directories:
  buildResources: build
files:
  - out/**
  - resources/**
asar: true
asarUnpack:
  - resources/embed/**
  - resources/child/**
  - resources/icon.png
win:
  icon: build/icon.png
  target:
    - nsis
    - zip
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: HexoDeck
  artifactName: ${productName}-Setup-${version}.${ext}
# 自动更新：GitHub Releases 作为更新源（electron-updater 读取打包产物中的 app-update.yml）
publish:
  provider: github
  owner: wanwuzhishi
  repo: HexoDeck
